name: Update README cards  on:   workflow_dispatch: # Vß║½n giß╗» ─æß╗â bß║ín c├│ thß╗â bß║Ñm n├║t chß║íy thß╗º c├┤ng bß║Ñt cß╗⌐ l├║c n├áo   schedule:     - cron: '0 0 * * 0' # ≡ƒÜÇ Tß╗░ ─Éß╗ÿNG CHß║áY V├ÇO 00:00 CHß╗ª NHß║¼T H├ÇNG TUß║ªN (Giß╗¥ UTC)  # Cß║Ñp quyß╗ün GHI cho bot ─æß╗â n├│ c├│ thß╗â push file l├¬n Github permissions:   contents: write  jobs:   build:     runs-on: ubuntu-latest     steps:       - uses: actions/checkout@v4        - name: Generate GitHub Stats card         uses: readme-tools/github-readme-stats-action@v1         with:           card: stats           options: username=${{ github.repository_owner }}&show_icons=true&theme=dracula&hide_border=true           path: profile/stats.svg           token: ${{ secrets.GITHUB_TOKEN }}        - name: Generate Top Languages card         uses: readme-tools/github-readme-stats-action@v1         with:           card: top-langs           options: username=${{ github.repository_owner }}&show_icons=true&theme=dracula&hide_border=true&layout=compact           path: profile/top-langs.svg           token: ${{ secrets.GITHUB_TOKEN }}        - name: Generate GitHub Trophies         uses: Erik-Donath/github-profile-trophy@feature/generate-svg         with:           username: ${{ github.repository_owner }}           token: ${{ secrets.GITHUB_TOKEN }}           file: profile/trophy.svg               theme: dracula           margin-width: 8                          margin-height: 8                       max-cols: 6                         no-frame: true        - name: Commit cards         run: |           git config user.name "github-actions[bot]"           git config user.email "github-actions[bot]@users.noreply.github.com"           git add profile/*.svg           git commit -m "Update README cards and trophies weekly" || exit 0           git push